    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

<body class="bg-body-tertiary">
<!-- PowerBook – MIT License – powerscripts.org. Gleicher Inhalt wie die aufklappbare Hilfe im Gästebuch-Formular (pb_render_help()). -->
<main class="container py-4" style="max-width: 40rem">
<h1 class="h4 mb-3">Hilfe zur Formatierung</h1>
<div class="row g-4"><div class="col-12"><h3 class="h6">Formatierung</h3><table class="table table-sm pb-help-table mb-2"><thead><tr><th scope="col">Eingabe</th><th scope="col">Ergebnis</th></tr></thead><tbody><tr><td><code>[b]fett[/b]</code></td><td><b>fett</b></td></tr><tr><td><code>[i]kursiv[/i]</code></td><td><i>kursiv</i></td></tr><tr><td><code>[u]unterstrichen[/u]</code></td><td><u>unterstrichen</u></td></tr><tr><td><code>[small]klein[/small]</code></td><td><small>klein</small></td></tr></tbody></table><p class="small text-body-secondary mb-0">Jedes Tag braucht sein Ende, zum Beispiel <code>[b]</code> … <code>[/b]</code>. Adressen, die mit <code>https://</code> oder <code>http://</code> beginnen, werden automatisch zu Links.</p></div></div>
</main>
</body>
</html>
