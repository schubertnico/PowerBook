<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hilfe zu Smileys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<!-- PowerBook – MIT License – powerscripts.org. Gleicher Inhalt wie die aufklappbare Hilfe im Gästebuch-Formular (pb_render_help()). -->
<main class="container py-4" style="max-width: 40rem">
<h1 class="h4 mb-3">Hilfe zu Smileys</h1>
<div class="row g-4"><div class="col-12"><h3 class="h6">Smileys</h3><table class="table table-sm pb-help-table mb-2"><thead><tr><th scope="col">Code</th><th scope="col">Bild</th><th scope="col">Bedeutung</th></tr></thead><tbody><tr><td><code>:)</code></td><td><img src="smilies/happy1.gif" alt=":)" class="pb-smiley"></td><td>Lächeln</td></tr><tr><td><code>:D</code></td><td><img src="smilies/happy4.gif" alt=":D" class="pb-smiley"></td><td>Grinsen</td></tr><tr><td><code>;)</code></td><td><img src="smilies/happy3.gif" alt=";)" class="pb-smiley"></td><td>Zwinkern</td></tr><tr><td><code>:P</code></td><td><img src="smilies/happy2.gif" alt=":P" class="pb-smiley"></td><td>Zunge zeigen</td></tr><tr><td><code>;o)</code></td><td><img src="smilies/happy5.gif" alt=";o)" class="pb-smiley"></td><td>Cool</td></tr><tr><td><code>?:)</code></td><td><img src="smilies/confused.gif" alt="?:)" class="pb-smiley"></td><td>Verwirrt</td></tr><tr><td><code>!:)</code></td><td><img src="smilies/shock.gif" alt="!:)" class="pb-smiley"></td><td>Erschrocken</td></tr><tr><td><code>:(</code></td><td><img src="smilies/sad1.gif" alt=":(" class="pb-smiley"></td><td>Traurig</td></tr><tr><td><code>;(</code></td><td><img src="smilies/sad2.gif" alt=";(" class="pb-smiley"></td><td>Bedrückt</td></tr><tr><td><code>:X</code></td><td><img src="smilies/sad3.gif" alt=":X" class="pb-smiley"></td><td>Verärgert</td></tr></tbody></table><p class="small text-body-secondary mb-0">Vor einem Smiley steht ein Leerzeichen. Die Schreibweise mit Nase wie <code>:-)</code> funktioniert auch.</p></div></div>
</main>
</body>
</html>
