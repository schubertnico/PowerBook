name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: PHPUnit (PHP ${{ matrix.php-version }}, ${{ matrix.db-name }})
    runs-on: ubuntu-latest

    # Installer, update.php und Schema werden gegen einen echten Datenbankserver
    # getestet (tests/Integration/MysqlTestCase.php). Ohne PB_TEST_DB_HOST würden
    # diese Tests übersprungen.
    services:
      db:
        image: ${{ matrix.db-image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        # PowerBook benötigt PHP 8.4 (siehe composer.json: "php": "^8.4").
        php-version: ['8.4']
        db-name: ['MySQL 8.0', 'MariaDB 10.6']
        include:
          - db-name: 'MySQL 8.0'
            db-image: 'mysql:8.0'
            mysql: true
          - db-name: 'MariaDB 10.6'
            db-image: 'mariadb:10.6'
            mysql: false

    env:
      PB_TEST_DB_HOST: 127.0.0.1
      PB_TEST_DB_PORT: 3306
      PB_TEST_DB_USER: root
      PB_TEST_DB_PASSWORD: root
      PB_TEST_DB_PREFIX: pbtest_

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring
          coverage: xdebug

      - name: MySQL wie bei verwalteten Hostern (Primärschlüssel Pflicht)
        if: matrix.mysql
        run: mysql -h 127.0.0.1 -uroot -proot -e "SET GLOBAL sql_require_primary_key = ON; SELECT VERSION(), @@sql_mode, @@sql_require_primary_key;"

      - name: Datenbankserver anzeigen
        if: ${{ !matrix.mysql }}
        run: mysql -h 127.0.0.1 -uroot -proot -e "SELECT VERSION(), @@sql_mode;"

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit tests
        if: ${{ !matrix.mysql }}
        run: composer test

      - name: Run PHPUnit with coverage
        if: matrix.mysql
        run: composer test -- --coverage-text --coverage-clover=coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.mysql
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, mbstring

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check code style (PHPStan Level 8)
        run: composer phpstan

      - name: Run Psalm (Level 4)
        run: composer psalm

      - name: Check code quality (PHPMD)
        run: composer phpmd

      - name: Check code style (PHP-CS-Fixer)
        run: composer cs-check
